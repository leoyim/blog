<!DOCTYPE html>
<html>
<head>
	<link rel="icon" href="favicon.ico">
	<title>Love like Sakura</title>
	<meta charset="utf-8">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:ital,wght@0,400;0,700;1,400;1,700&family=Hurricane&display=swap" rel="stylesheet">
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		body {
			background: linear-gradient(180deg, #87CEEB 0%, #B0E0E6 30%, #FFE4E1 70%, #FFB6C1 100%);
			margin: 0;
			padding: 0;
			overflow: hidden;
			min-height: 100vh;
		}
		canvas {
			display: block;
			position: absolute;
			top: 0;
			left: 0;
		}
		#timer {
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			background: linear-gradient(135deg, rgba(255,255,255,0.85), rgba(255,240,245,0.75));
			color: #d65dbb;
			text-align: center;
			padding: 20px 40px;
			font-family: 'Ma Shan Zheng', cursive;
			font-size: 42px;
			border-radius: 25px;
			border: 2px solid rgba(255, 183, 197, 0.8);
			box-shadow: 
				0 8px 32px rgba(255, 183, 197, 0.4),
				0 0 60px rgba(255, 255, 255, 0.6) inset;
			backdrop-filter: blur(10px);
			z-index: 100;
			pointer-events: none;
		}
		@font-face {
			font-family: 'PlaywriteDKUloopetGuides-Regular';
			src: url("PlaywriteDKUloopetGuides-Regular.ttf") format("truetype");
			font-display: swap;
		}
		@font-face {
			font-family: 'FingerPaint-Regular';
			src: url("FingerPaint-Regular.ttf") format("truetype");
			font-display: swap;
		}
		day, times {
			font-family: 'FingerPaint-Regular';
			font-size: 72px;
		}
		day {
			color: #ff69b4;
			text-shadow:
				0 0 0.3em rgba(255, 20, 147, 0.6),
				0 0 0.6em rgba(255, 105, 180, 0.4),
				0 2px 4px rgba(255, 255, 255, 0.8);
		}
		times {
			color: #ff85a2;
			text-shadow:
				0 0 0.3em rgba(255, 107, 138, 0.6),
				0 0 0.6em rgba(255, 133, 162, 0.4),
				0 2px 4px rgba(255, 255, 255, 0.8);
		}

		.love{
			position: fixed;
			bottom: 0;
			left: 0;
			width: 100%;
			padding: 20px;
			color: rgba(64, 21, 101, 0.997);
			text-align: center;
			font-family: PlaywriteDKUloopetGuides-Regular;
			font-weight: bolder;
		}
	</style>
</head>
<body>
<div id="timer"></div>
<canvas id="canvas"></canvas>
<div class="love"> I Love U, MengYu <br> Begin 2023-06-08, End Forever </div>
<audio id="bg-music" loop>
	<source src="rsdxzmm.mp3" type="audio/mp3">
</audio>
<script>
	// 点击屏幕播放背景音乐
    const audio = document.getElementById('bg-music')
	const hearts = [];
	
	document.addEventListener('click', function(event) {
		hearts.push({
			x: event.clientX,
			y: event.clientY,
			size: 0,
			opacity: 1,
			maxSize: 20 + Math.random() * 15
		});
		audio.play();
	});

	// 获取画布
	var canvas = document.getElementById("canvas");
	var context = canvas.getContext("2d");

	// 设置画布大小
	canvas.width = window.innerWidth;
	canvas.height = window.innerHeight;

	// 创建数组
	var petals = [];

	// 创建计时器
	var startTime = new Date("2023-06-08T22:08:00").getTime();

	// 绘制樱花形状
	function drawSakuraFlower(ctx, x, y, size, color, opacity, rotation) {
		ctx.save();
		ctx.translate(x, y);
		ctx.rotate(rotation * Math.PI / 180);
		ctx.globalAlpha = opacity;
		
		// 绘制五瓣樱花
		for (let i = 0; i < 5; i++) {
			ctx.rotate(72 * Math.PI / 180);
			ctx.beginPath();
			ctx.fillStyle = color;
			ctx.moveTo(0, 0);
			ctx.bezierCurveTo(
				size * 0.3, size * 0.3,
				size * 0.4, size * 0.8,
				0, size
			);
			ctx.bezierCurveTo(
				-size * 0.4, size * 0.8,
				-size * 0.3, size * 0.3,
				0, 0
			);
			ctx.fill();
		}
		
		// 花蕊
		ctx.beginPath();
		ctx.fillStyle = 'rgba(255, 255, 220, ' + (opacity * 0.9) + ')';
		ctx.arc(0, 0, size * 0.25, 0, Math.PI * 2);
		ctx.fill();
		
		ctx.restore();
	}

	// 绘制单个飘落的花瓣
	function drawFallingPetal(ctx, x, y, size, rotation, color, opacity, wobble) {
		ctx.save();
		ctx.translate(x, y);
		ctx.rotate(rotation * Math.PI / 180);
		ctx.globalAlpha = opacity;
		
		ctx.beginPath();
		ctx.fillStyle = color;
		
		const wobbleOffset = Math.sin(wobble) * 2;
		ctx.moveTo(0, -size * 0.3);
		ctx.bezierCurveTo(
			size * 0.4 + wobbleOffset, -size * 0.2,
			size * 0.5, size * 0.3,
			0, size * 0.6
		);
		ctx.bezierCurveTo(
			-size * 0.5, size * 0.3,
			-size * 0.4 - wobbleOffset, -size * 0.2,
			0, -size * 0.3
		);
		ctx.fill();
		
		ctx.restore();
	}

	// 樱花花瓣类
	function Petal(x, y) {
		this.x = x || Math.random() * canvas.width;
		this.y = y || -20;
		this.size = Math.random() * 8 + 6;
		this.speedY = Math.random() * 1 + 0.5;
		this.speedX = Math.random() * 1 - 0.5;
		this.rotation = Math.random() * 360;
		this.rotationSpeed = Math.random() * 1 - 0.5;
		this.opacity = Math.random() * 0.4 + 0.6;
		this.wobble = Math.random() * Math.PI * 2;
		this.wobbleSpeed = Math.random() * 0.03 + 0.02;
		this.wobbleAmount = Math.random() * 1.5 + 0.5;
		
		const colors = [
			'rgba(255, 183, 197, ',
			'rgba(255, 192, 203, ',
			'rgba(255, 160, 180, ',
			'rgba(255, 224, 229, ',
			'rgba(250, 200, 210, '
		];
		this.baseColor = colors[Math.floor(Math.random() * colors.length)];
	}

	function updatePetal(petal) {
		petal.y += petal.speedY;
		petal.x += petal.speedX + Math.sin(petal.wobble) * petal.wobbleAmount;
		petal.wobble += petal.wobbleSpeed;
		petal.rotation += petal.rotationSpeed;
		
		if (petal.y > canvas.height + 20) {
			petal.y = -20;
			petal.x = Math.random() * canvas.width;
			petal.opacity = Math.random() * 0.4 + 0.6;
		}
	}

	function createPetal() {
		if (petals.length < 250) {
			petals.push(new Petal());
		}
	}

	// 更新计时器
	function updateTimer() {
		var currentTime = new Date().getTime();
		var timeDiff = currentTime - startTime;
		var seconds = Math.floor(timeDiff / 1000);
		var minutes = Math.floor(seconds / 60);
		var hours = Math.floor(minutes / 60);
		var days = Math.floor(hours / 24);
		hours %= 24;
		minutes %= 60;
		seconds %= 60;

		var timer = document.getElementById("timer");
		timer.innerHTML = "<day>" + days + "</day> <times>" + hours + ":" + minutes + ":" + seconds + "</times>";
	}

	// 绘制点击爱心
	function drawHearts(ctx) {
		for (let i = hearts.length - 1; i >= 0; i--) {
			const heart = hearts[i];
			heart.size += (heart.maxSize - heart.size) * 0.1;
			heart.opacity -= 0.02;
			heart.y -= 0.5;
			
			if (heart.opacity <= 0) {
				hearts.splice(i, 1);
				continue;
			}
			
			ctx.save();
			ctx.translate(heart.x, heart.y);
			ctx.globalAlpha = heart.opacity;
			ctx.fillStyle = 'rgba(255, 105, 180, 0.8)';
			
			ctx.beginPath();
			const size = heart.size;
			ctx.moveTo(0, size * 0.3);
			ctx.bezierCurveTo(size * 0.5, -size * 0.3, size, 0, 0, size);
			ctx.bezierCurveTo(-size, 0, -size * 0.5, -size * 0.3, 0, size * 0.3);
			ctx.fill();
			
			ctx.restore();
		}
	}

	// 循环绘制
	function loop() {
		// 清空画布
		context.clearRect(0, 0, canvas.width, canvas.height);

		// 随机生成飘落的花瓣
		if (Math.random() < 0.25) {
			createPetal();
		}

		// 更新和绘制飘落的花瓣
		petals.forEach(petal => {
			updatePetal(petal);
			drawFallingPetal(context, petal.x, petal.y, petal.size, 
				petal.rotation, petal.baseColor + petal.opacity + ')', petal.opacity, petal.wobble);
		});
		
		// 绘制点击爱心
		drawHearts(context);

		// 更新计时器
		updateTimer();

		// 循环绘制
		requestAnimationFrame(loop);
	}

	// 窗口大小改变时调整画布
	window.addEventListener('resize', function() {
		canvas.width = window.innerWidth;
		canvas.height = window.innerHeight;
		petals = [];
	});

	// 启动循环绘制
	loop();
</script>
</body>
</html>
