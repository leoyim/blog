<!DOCTYPE html>
<html>
<head>
	<link rel="icon" href="favicon.ico">
	<title>Love like Sakura & Stars</title>
	<meta charset="utf-8">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:ital,wght@0,400;0,700;1,400;1,700&family=Hurricane&display=swap" rel="stylesheet">
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		body {
			margin: 0;
			padding: 0;
			overflow: hidden;
			min-height: 100vh;
			transition: background 2s ease;
		}
		body.day {
			background: linear-gradient(180deg, #87CEEB 0%, #B0E0E6 30%, #FFE4E1 70%, #FFB6C1 100%);
		}
		body.spring-day {
			background: #f7f7f5;
		}
		body.night {
			background-color: #000;
		}
		canvas {
			display: block;
			position: absolute;
			top: 0;
			left: 0;
			z-index: 0;
		}
		#timer {
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			color: #d65dbb;
			text-align: center;
			padding: 20px 40px;
			font-family: 'Ma Shan Zheng', cursive;
			font-size: 42px;
			border-radius: 25px;
			z-index: 100;
			pointer-events: none;
			transition: all 2s ease;
		}
		body.day #timer {
			color: #d65dbb;
			text-shadow:
				0 0 10px rgba(214, 93, 187, 0.8),
				0 0 20px rgba(214, 93, 187, 0.6),
				0 0 30px rgba(214, 93, 187, 0.4);
		}
		body.spring-day #timer {
			background: linear-gradient(90deg, #4CAF50, #87CEEB);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			background-clip: text;
			filter: drop-shadow(0 0 10px rgba(76, 175, 80, 0.5)) drop-shadow(0 0 20px rgba(135, 206, 235, 0.3));
		}
		body.night #timer {
			color: #FFF;
			text-shadow:
				0 0 10px rgba(255, 255, 255, 0.8),
				0 0 20px rgba(255, 255, 255, 0.6),
				0 0 30px rgba(255, 255, 255, 0.4),
				0 0 40px rgba(92, 1, 251, 0.3);
		}
		@font-face {
			font-family: 'PlaywriteDKUloopetGuides-Regular';
			src: url("PlaywriteDKUloopetGuides-Regular.ttf") format("truetype");
			font-display: swap;
		}
		@font-face {
			font-family: 'FingerPaint-Regular';
			src: url("FingerPaint-Regular.ttf") format("truetype");
			font-display: swap;
		}
		day, times {
			font-family: 'FingerPaint-Regular';
			font-size: 72px;
		}
		body.day day {
			color: #ff69b4;
			text-shadow:
				0 0 0.3em rgba(255, 20, 147, 0.6),
				0 0 0.6em rgba(255, 105, 180, 0.4),
				0 2px 4px rgba(255, 255, 255, 0.8);
		}
		body.day times {
			color: #ff85a2;
			text-shadow:
				0 0 0.3em rgba(255, 107, 138, 0.6),
				0 0 0.6em rgba(255, 133, 162, 0.4),
				0 2px 4px rgba(255, 255, 255, 0.8);
		}
		body.night day {
			color: #ffdfdf;
			text-shadow:
				0 0 0.2em red,
				0 0 0.4em #f00,
				0 0 0.6em #ff0000,
				0 0 0.8em #ff5050,
				0 0 1em #ff7f7f;
		}
		body.night times {
			color: rgb(207, 255, 239);
			text-shadow:
				0 0 0.2em #0fa,
				0 0 0.4em #0fa,
				0 0 0.6em #0fa,
				0 0 0.8em rgb(156, 246, 216),
				0 0 1em rgb(156, 246, 216);
		}

		.love {
			position: fixed;
			bottom: 0;
			left: 0;
			width: 100%;
			padding: 20px;
			text-align: center;
			font-family: PlaywriteDKUloopetGuides-Regular;
			font-weight: bolder;
			transition: color 2s ease;
		}
		body.day .love {
			color: rgba(64, 21, 101, 0.997);
		}
		body.spring-day .love {
			color: rgba(100, 80, 60, 0.7);
		}
		body.night .love {
			color: white;
		}

		.heart {
			position: absolute;
			left: 0;
			top: 0;
			animation: heart 1s ease-out forwards;
		}
		.heart::before {
			content: "\1F496";
			position: absolute;
			top: 0;
			left: 0;
			font-size: 18px;
		}
		@keyframes heart {
			0% { transform: scale(0); opacity: 0; }
			30% { transform: scale(1); opacity: 1; }
			50% { transform: scale(1.5); opacity: 0.5; }
			100% { transform: scale(2); opacity: 0; }
		}

		/* Hidden test panel */
		#test-panel {
			display: none;
			position: fixed;
			top: 10px;
			right: 10px;
			background: rgba(0, 0, 0, 0.8);
			color: white;
			padding: 15px;
			border-radius: 8px;
			font-family: Arial, sans-serif;
			font-size: 14px;
			z-index: 10000;
			max-width: 300px;
		}
		#test-panel.active {
			display: block;
		}
		#test-panel label {
			display: block;
			margin: 8px 0 4px 0;
		}
		#test-panel input, #test-panel select {
			width: 100%;
			padding: 5px;
			margin-bottom: 10px;
			border: 1px solid #555;
			background: #333;
			color: white;
			border-radius: 4px;
		}
		#test-panel button {
			width: 100%;
			padding: 8px;
			margin-top: 5px;
			background: #4CAF50;
			color: white;
			border: none;
			border-radius: 4px;
			cursor: pointer;
		}
		#test-panel button:hover {
			background: #45a049;
		}
		#test-panel .hint {
			font-size: 11px;
			color: #aaa;
			margin-top: 10px;
		}

		/* Spring SVG Scene */
		.spring-scene {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: 1;
			pointer-events: none;
		}
		body.spring-day .spring-scene {
			display: block;
		}

		/* Willow branch sway */
		.willow-branch {
			transform-origin: top center;
			animation: willowSway 8s ease-in-out infinite;
		}
		@keyframes willowSway {
			0%, 100% { transform: rotate(0deg) translateX(0); }
			20% { transform: rotate(3deg) translateX(6px); }
			40% { transform: rotate(-1deg) translateX(-3px); }
			60% { transform: rotate(4deg) translateX(8px); }
			80% { transform: rotate(-2deg) translateX(-4px); }
		}

		/* Swallow flight paths */
		@keyframes fly1 {
			0% { transform: translate(0, 0); }
			10% { transform: translate(60px, -15px); }
			25% { transform: translate(140px, 10px); }
			40% { transform: translate(100px, -20px); }
			55% { transform: translate(180px, 5px); }
			70% { transform: translate(120px, -10px); }
			85% { transform: translate(50px, 8px); }
			100% { transform: translate(0, 0); }
		}
		@keyframes fly2 {
			0% { transform: translate(0, 0); }
			15% { transform: translate(-80px, 12px); }
			30% { transform: translate(-50px, -18px); }
			50% { transform: translate(-120px, 8px); }
			65% { transform: translate(-70px, -12px); }
			80% { transform: translate(-30px, 15px); }
			100% { transform: translate(0, 0); }
		}
		@keyframes fly3 {
			0% { transform: translate(0, 0); }
			20% { transform: translate(90px, 15px); }
			40% { transform: translate(50px, -12px); }
			60% { transform: translate(110px, 8px); }
			80% { transform: translate(40px, -10px); }
			100% { transform: translate(0, 0); }
		}
		@keyframes fly4 {
			0% { transform: translate(0, 0); }
			12% { transform: translate(-50px, -10px); }
			30% { transform: translate(40px, 12px); }
			50% { transform: translate(80px, -8px); }
			70% { transform: translate(30px, 15px); }
			85% { transform: translate(-20px, -5px); }
			100% { transform: translate(0, 0); }
		}

		/* Wing flapping */
		.wing-left {
			transform-origin: 0 0;
			animation: flapLeft 0.6s ease-in-out infinite;
		}
		.wing-right {
			transform-origin: 0 0;
			animation: flapRight 0.6s ease-in-out infinite;
		}
		@keyframes flapLeft {
			0%, 100% { transform: rotate(0deg); }
			50% { transform: rotate(-20deg); }
		}
		@keyframes flapRight {
			0%, 100% { transform: rotate(0deg); }
			50% { transform: rotate(20deg); }
		}

		/* Falling leaves */
		@keyframes fall1 {
			0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
			8% { opacity: 0.6; }
			25% { transform: translate(30px, 150px) rotate(60deg); opacity: 0.55; }
			50% { transform: translate(60px, 300px) rotate(150deg); opacity: 0.5; }
			75% { transform: translate(40px, 500px) rotate(250deg); opacity: 0.35; }
			92% { opacity: 0.15; }
			100% { transform: translate(80px, 700px) rotate(360deg); opacity: 0; }
		}
		@keyframes fall2 {
			0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
			8% { opacity: 0.55; }
			20% { transform: translate(-25px, 120px) rotate(-50deg); opacity: 0.5; }
			45% { transform: translate(-50px, 280px) rotate(-130deg); opacity: 0.45; }
			70% { transform: translate(-30px, 450px) rotate(-220deg); opacity: 0.3; }
			90% { opacity: 0.1; }
			100% { transform: translate(-60px, 650px) rotate(-300deg); opacity: 0; }
		}
		@keyframes fall3 {
			0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
			6% { opacity: 0.5; }
			15% { transform: translate(20px, 100px) rotate(40deg); opacity: 0.5; }
			35% { transform: translate(-15px, 250px) rotate(100deg); opacity: 0.45; }
			55% { transform: translate(35px, 380px) rotate(180deg); opacity: 0.35; }
			75% { transform: translate(-10px, 520px) rotate(260deg); opacity: 0.2; }
			90% { opacity: 0.08; }
			100% { transform: translate(25px, 680px) rotate(340deg); opacity: 0; }
		}
		/* Floating Clouds — multi-layer depth */
		.clouds-far { opacity: 1; }
		.clouds-mid { opacity: 1; }
		.clouds-near { opacity: 1; }

		/* Cloud drop shadow for depth against sky */
		.clouds-far ellipse,
		.clouds-mid ellipse,
		.clouds-near ellipse {
			filter: drop-shadow(0 2px 3px rgba(100, 160, 200, 0.15));
		}

		.cloud-float1 { animation: cloudDrift1 55s ease-in-out infinite; }
		.cloud-float2 { animation: cloudDrift2 70s ease-in-out infinite; }
		.cloud-float3 { animation: cloudDrift3 48s ease-in-out infinite; }
		.cloud-float4 { animation: cloudDrift4 62s ease-in-out infinite; }
		.cloud-float5 { animation: cloudDrift5 45s ease-in-out infinite; }

		@keyframes cloudDrift1 {
			0%, 100% { transform: translate(0, 0); }
			25% { transform: translate(28px, -10px); }
			50% { transform: translate(-12px, 6px); }
			75% { transform: translate(18px, -4px); }
		}
		@keyframes cloudDrift2 {
			0%, 100% { transform: translate(0, 0); }
			25% { transform: translate(-18px, 8px); }
			50% { transform: translate(22px, -12px); }
			75% { transform: translate(-6px, 4px); }
		}
		@keyframes cloudDrift3 {
			0%, 100% { transform: translate(0, 0); }
			25% { transform: translate(20px, -6px); }
			50% { transform: translate(-16px, 10px); }
			75% { transform: translate(10px, -8px); }
		}
		@keyframes cloudDrift4 {
			0%, 100% { transform: translate(0, 0); }
			25% { transform: translate(-22px, 10px); }
			50% { transform: translate(14px, -8px); }
			75% { transform: translate(-10px, 5px); }
		}
		@keyframes cloudDrift5 {
			0%, 100% { transform: translate(0, 0); }
			25% { transform: translate(24px, -12px); }
			50% { transform: translate(-8px, 8px); }
			75% { transform: translate(16px, -6px); }
		}
	</style>
</head>
<body>
<div id="timer"></div>
<canvas id="canvas"></canvas>

<!-- Spring Day SVG Scene -->
<svg id="spring-scene" class="spring-scene" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
	<defs>
		<!-- Watercolor gradient for grass -->
		<linearGradient id="grassGradient" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" style="stop-color:#d4e8d0;stop-opacity:0" />
			<stop offset="40%" style="stop-color:#b8d4b0;stop-opacity:0.3" />
			<stop offset="100%" style="stop-color:#8fbc8f;stop-opacity:0.6" />
		</linearGradient>

		<!-- Leaf gradient - yellow-green -->
		<linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" style="stop-color:#d4e09b;stop-opacity:0.85" />
			<stop offset="50%" style="stop-color:#c5d98e;stop-opacity:0.7" />
			<stop offset="100%" style="stop-color:#a8c97a;stop-opacity:0.55" />
		</linearGradient>

		<!-- Willow branch filter for watercolor effect -->
		<filter id="watercolor">
			<feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
			<feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
		</filter>
		<!-- Depth-of-field blur filters -->
		<filter id="depth-blur-far">
			<feGaussianBlur stdDeviation="2.5" />
		</filter>
		<filter id="depth-blur-mid">
			<feGaussianBlur stdDeviation="1.2" />
		</filter>
		<filter id="depth-blur-near">
			<feGaussianBlur stdDeviation="0.4" />
		</filter>

		<!-- Atmospheric haze gradient -->
		<linearGradient id="hazeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" style="stop-color:#e8f0e0;stop-opacity:0.15" />
			<stop offset="50%" style="stop-color:#dce8d4;stop-opacity:0.08" />
			<stop offset="100%" style="stop-color:#c8dcc0;stop-opacity:0.18" />
		</linearGradient>

		<!-- Morning glow radial gradient -->
		<radialGradient id="morningGlow" cx="25%" cy="20%" r="60%">
			<stop offset="0%" style="stop-color:#fff8e7;stop-opacity:0.25" />
			<stop offset="30%" style="stop-color:#fef0d0;stop-opacity:0.12" />
			<stop offset="70%" style="stop-color:#fde8c8;stop-opacity:0.04" />
			<stop offset="100%" style="stop-color:#fde8c8;stop-opacity:0" />
		</radialGradient>

		<!-- Soft edge feathering for overlays -->
		<filter id="soft-edge">
			<feGaussianBlur stdDeviation="8" />
		</filter>
		<!-- Sky gradient - spring daytime -->
		<linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" style="stop-color:#b3d9f7;stop-opacity:1" />
			<stop offset="35%" style="stop-color:#c9e4f7;stop-opacity:1" />
			<stop offset="60%" style="stop-color:#dfeee8;stop-opacity:1" />
			<stop offset="100%" style="stop-color:#f5ecd7;stop-opacity:1" />
		</linearGradient>
	</defs>

	<!-- Sky Background -->
	<rect x="0" y="0" width="1920" height="1080" fill="url(#skyGradient)"/>

	<!-- Morning Light Glow -->
	<rect x="0" y="0" width="1920" height="1080" fill="url(#morningGlow)" filter="url(#soft-edge)"/>

	<!-- Atmospheric Haze Layers -->
	<rect x="0" y="0" width="1920" height="420" fill="url(#hazeGradient)" filter="url(#soft-edge)" opacity="0.6"/>
	<rect x="0" y="350" width="1920" height="350" fill="url(#hazeGradient)" filter="url(#soft-edge)" opacity="0.3"/>


		<!-- Clouds — layered depth -->
		<!-- Far layer (smaller, slower, lighter) -->
		<g class="clouds-far">
			<g class="cloud-float1" transform="translate(1350, 120)">
				<ellipse cx="0" cy="0" rx="55" ry="20" fill="#ffffff" opacity="0.65"/>
				<ellipse cx="-35" cy="5" rx="40" ry="18" fill="#ffffff" opacity="0.55"/>
				<ellipse cx="35" cy="5" rx="42" ry="18" fill="#ffffff" opacity="0.55"/>
				<ellipse cx="-18" cy="-10" rx="35" ry="22" fill="#ffffff" opacity="0.7"/>
				<ellipse cx="18" cy="-8" rx="32" ry="20" fill="#ffffff" opacity="0.7"/>
				<ellipse cx="0" cy="-15" rx="28" ry="18" fill="#ffffff" opacity="0.75"/>
			</g>
			<g class="cloud-float2" transform="translate(1720, 80)">
				<ellipse cx="0" cy="0" rx="48" ry="17" fill="#ffffff" opacity="0.6"/>
				<ellipse cx="-30" cy="3" rx="34" ry="15" fill="#ffffff" opacity="0.5"/>
				<ellipse cx="30" cy="3" rx="36" ry="15" fill="#ffffff" opacity="0.5"/>
				<ellipse cx="-15" cy="-8" rx="28" ry="18" fill="#ffffff" opacity="0.65"/>
				<ellipse cx="15" cy="-7" rx="26" ry="17" fill="#ffffff" opacity="0.65"/>
				<ellipse cx="0" cy="-13" rx="22" ry="15" fill="#ffffff" opacity="0.7"/>
			</g>
		</g>

		<!-- Mid layer (medium, moderate speed) -->
		<g class="clouds-mid">
			<g class="cloud-float3" transform="translate(1200, 180)">
				<ellipse cx="0" cy="0" rx="70" ry="26" fill="#ffffff" opacity="0.75"/>
				<ellipse cx="-42" cy="6" rx="50" ry="22" fill="#ffffff" opacity="0.65"/>
				<ellipse cx="42" cy="6" rx="52" ry="22" fill="#ffffff" opacity="0.65"/>
				<ellipse cx="-22" cy="-12" rx="44" ry="26" fill="#ffffff" opacity="0.8"/>
				<ellipse cx="22" cy="-10" rx="40" ry="25" fill="#ffffff" opacity="0.8"/>
				<ellipse cx="0" cy="-20" rx="36" ry="22" fill="#ffffff" opacity="0.85"/>
			</g>
			<g class="cloud-float4" transform="translate(1620, 210)">
				<ellipse cx="0" cy="0" rx="65" ry="24" fill="#ffffff" opacity="0.7"/>
				<ellipse cx="-38" cy="5" rx="46" ry="20" fill="#ffffff" opacity="0.6"/>
				<ellipse cx="38" cy="5" rx="48" ry="20" fill="#ffffff" opacity="0.6"/>
				<ellipse cx="-20" cy="-11" rx="40" ry="24" fill="#ffffff" opacity="0.75"/>
				<ellipse cx="20" cy="-9" rx="38" ry="23" fill="#ffffff" opacity="0.75"/>
				<ellipse cx="0" cy="-18" rx="32" ry="20" fill="#ffffff" opacity="0.8"/>
			</g>
		</g>

		<!-- Near layer (larger, faster, more opaque) -->
		<g class="clouds-near">
			<g class="cloud-float5" transform="translate(1480, 260)">
				<ellipse cx="0" cy="0" rx="85" ry="32" fill="#ffffff" opacity="0.85"/>
				<ellipse cx="-50" cy="7" rx="60" ry="26" fill="#ffffff" opacity="0.75"/>
				<ellipse cx="50" cy="7" rx="62" ry="26" fill="#ffffff" opacity="0.75"/>
				<ellipse cx="-26" cy="-15" rx="54" ry="32" fill="#ffffff" opacity="0.9"/>
				<ellipse cx="26" cy="-12" rx="50" ry="30" fill="#ffffff" opacity="0.9"/>
				<ellipse cx="0" cy="-24" rx="44" ry="28" fill="#ffffff" opacity="0.95"/>
			</g>
		</g>
	<!-- Willow Branches Group -->
	<g class="willow-branches" filter="url(#watercolor)">
		<!-- Branch 1 - main, natural droop -->
		<g class="willow-branch" style="animation-delay: 0s;">
			<path d="M 100,-5 C 120,40 140,90 170,150 C 195,210 210,290 200,380 C 195,430 185,480 175,530" stroke="#6b4226" stroke-width="2.8" fill="none" opacity="0.7"/>
			<path d="M 170,150 C 155,200 140,270 130,350 C 125,400 128,440 135,480" stroke="#8b6942" stroke-width="1.3" fill="none" opacity="0.45"/>
			<path d="M 145,100 C 165,150 185,220 195,300 C 200,340 198,380 190,420" stroke="#8b6942" stroke-width="1" fill="none" opacity="0.4"/>
			<ellipse cx="115" cy="30" rx="3" ry="12" fill="url(#leafGradient)" transform="rotate(-15 115 30)"/>
			<ellipse cx="125" cy="58" rx="3" ry="13" fill="url(#leafGradient)" transform="rotate(-20 125 58)"/>
			<ellipse cx="138" cy="88" rx="3.5" ry="14" fill="url(#leafGradient)" transform="rotate(-12 138 88)"/>
			<ellipse cx="152" cy="118" rx="3" ry="15" fill="url(#leafGradient)" transform="rotate(-25 152 118)"/>
			<ellipse cx="165" cy="148" rx="3.5" ry="14" fill="url(#leafGradient)" transform="rotate(-18 165 148)"/>
			<ellipse cx="178" cy="180" rx="3" ry="13" fill="url(#leafGradient)" transform="rotate(-30 178 180)"/>
			<ellipse cx="190" cy="215" rx="3" ry="15" fill="url(#leafGradient)" transform="rotate(-22 190 215)"/>
			<ellipse cx="200" cy="250" rx="3" ry="14" fill="url(#leafGradient)" transform="rotate(-15 200 250)"/>
			<ellipse cx="205" cy="290" rx="2.5" ry="13" fill="url(#leafGradient)" transform="rotate(-35 205 290)"/>
			<ellipse cx="203" cy="330" rx="2.5" ry="12" fill="url(#leafGradient)" transform="rotate(-20 203 330)"/>
			<ellipse cx="198" cy="370" rx="2.5" ry="13" fill="url(#leafGradient)" transform="rotate(-40 198 370)"/>
			<ellipse cx="192" cy="410" rx="2" ry="11" fill="url(#leafGradient)" transform="rotate(-25 192 410)"/>
			<ellipse cx="185" cy="450" rx="2" ry="10" fill="url(#leafGradient)" transform="rotate(-45 185 450)"/>

<script>
	const audio = document.getElementById('bg-music');
	const hearts = [];

	// Sunrise/sunset times (will be fetched from API)
	let sunriseTime = null;
	let sunsetTime = null;

	// Beijing coordinates
	const LAT = 39.9042;
	const LNG = 116.4074;

	// Parse time string like "8:44:11 PM" or "11:47:37 AM" to Date object (today's date)
	function parseTimeToToday(timeStr) {
		const match = timeStr.match(/(\d+):(\d+):(\d+)\s*(AM|PM)/i);
		if (!match) return null;

		let hours = parseInt(match[1]);
		const minutes = parseInt(match[2]);
		const seconds = parseInt(match[3]);
		const period = match[4].toUpperCase();

		if (period === 'PM' && hours !== 12) hours += 12;
		if (period === 'AM' && hours === 12) hours = 0;

		const today = new Date();
		today.setUTCHours(hours, minutes, seconds, 0);
		return today;
	}

	// Fetch sunrise/sunset data from API
	async function fetchSunTimes() {
		try {
			const response = await fetch(`https://api.sunrise-sunset.org/json?lat=${LAT}&lng=${LNG}&date=today`);
			const data = await response.json();

			if (data.status === 'OK') {
				sunriseTime = parseTimeToToday(data.results.sunrise);
				sunsetTime = parseTimeToToday(data.results.sunset);
				console.log('Sunrise:', sunriseTime.toISOString(), 'Sunset:', sunsetTime.toISOString());
			}
		} catch (error) {
			console.warn('Failed to fetch sunrise/sunset times, using fallback:', error);
		}
	}

	// Determine if it's night based on sunrise/sunset
	function isNight() {
		if (sunriseTime && sunsetTime) {
			const now = new Date();
			// Night if before sunrise or after sunset
			return now < sunriseTime || now > sunsetTime;
		}
		// Fallback: fixed time (8 PM - 6 AM)
		const hour = new Date().getHours();
		return hour >= 20 || hour < 6;
	}

	// Determine current season based on month
	function getSeason() {
		const month = new Date().getMonth(); // 0-11
		if (month >= 2 && month <= 4) return 'spring'; // March, April, May
		if (month >= 5 && month <= 7) return 'summer'; // June, July, August
		if (month >= 8 && month <= 10) return 'autumn'; // September, October, November
		return 'winter'; // December, January, February
	}

	function applyTheme() {
		if (isNight()) {
			document.body.className = 'night';
		} else {
			const season = getSeason();
			document.body.className = season === 'spring' ? 'spring-day' : 'day';
		}
	}

	// Fetch sun times on load, then apply theme
	fetchSunTimes().then(() => {
		applyTheme();
		// Refresh sun times daily at midnight
		setInterval(fetchSunTimes, 24 * 60 * 60 * 1000);
	});

	// Check theme every minute
	setInterval(applyTheme, 60000);

	document.addEventListener('click', function(event) {
		if (event.target.closest('#test-panel')) return;
		audio.play();
		if (isNight()) {
			var heart = document.createElement("div");
			heart.classList.add("heart");
			heart.style.left = event.clientX + "px";
			heart.style.top = event.clientY + "px";
			document.body.appendChild(heart);
			setTimeout(function() { heart.remove(); }, 1000);
		} else {
			hearts.push({
				x: event.clientX,
				y: event.clientY,
				size: 0,
				opacity: 1,
				maxSize: 20 + Math.random() * 15
			});
		}
	});

	var canvas = document.getElementById("canvas");
	var context = canvas.getContext("2d");
	canvas.width = window.innerWidth;
	canvas.height = window.innerHeight;

	var startTime = new Date("2023-06-08T22:08:00").getTime();

	// ===== Sakura (Day) =====
	var petals = [];

	function drawSakuraFlower(ctx, x, y, size, color, opacity, rotation) {
		ctx.save();
		ctx.translate(x, y);
		ctx.rotate(rotation * Math.PI / 180);
		ctx.globalAlpha = opacity;
		for (let i = 0; i < 5; i++) {
			ctx.rotate(72 * Math.PI / 180);
			ctx.beginPath();
			ctx.fillStyle = color;
			ctx.moveTo(0, 0);
			ctx.bezierCurveTo(size * 0.3, size * 0.3, size * 0.4, size * 0.8, 0, size);
			ctx.bezierCurveTo(-size * 0.4, size * 0.8, -size * 0.3, size * 0.3, 0, 0);
			ctx.fill();
		}
		ctx.beginPath();
		ctx.fillStyle = 'rgba(255, 255, 220, ' + (opacity * 0.9) + ')';
		ctx.arc(0, 0, size * 0.25, 0, Math.PI * 2);
		ctx.fill();
		ctx.restore();
	}

	function drawFallingPetal(ctx, x, y, size, rotation, color, opacity, wobble) {
		ctx.save();
		ctx.translate(x, y);
		ctx.rotate(rotation * Math.PI / 180);
		ctx.globalAlpha = opacity;
		ctx.beginPath();
		ctx.fillStyle = color;
		const wobbleOffset = Math.sin(wobble) * 2;
		ctx.moveTo(0, -size * 0.3);
		ctx.bezierCurveTo(size * 0.4 + wobbleOffset, -size * 0.2, size * 0.5, size * 0.3, 0, size * 0.6);
		ctx.bezierCurveTo(-size * 0.5, size * 0.3, -size * 0.4 - wobbleOffset, -size * 0.2, 0, -size * 0.3);
		ctx.fill();
		ctx.restore();
	}

	function Petal(x, y) {
		this.x = x || Math.random() * canvas.width;
		this.y = y || -20;
		this.size = Math.random() * 8 + 6;
		this.speedY = Math.random() * 1 + 0.5;
		this.speedX = Math.random() * 1 - 0.5;
		this.rotation = Math.random() * 360;
		this.rotationSpeed = Math.random() * 1 - 0.5;
		this.opacity = Math.random() * 0.4 + 0.6;
		this.wobble = Math.random() * Math.PI * 2;
		this.wobbleSpeed = Math.random() * 0.03 + 0.02;
		this.wobbleAmount = Math.random() * 1.5 + 0.5;
		const colors = [
			'rgba(255, 183, 197, ',
			'rgba(255, 192, 203, ',
			'rgba(255, 160, 180, ',
			'rgba(255, 224, 229, ',
			'rgba(250, 200, 210, '
		];
		this.baseColor = colors[Math.floor(Math.random() * colors.length)];
	}

	function updatePetal(petal) {
		petal.y += petal.speedY;
		petal.x += petal.speedX + Math.sin(petal.wobble) * petal.wobbleAmount;
		petal.wobble += petal.wobbleSpeed;
		petal.rotation += petal.rotationSpeed;
		if (petal.y > canvas.height + 20) {
			petal.y = -20;
			petal.x = Math.random() * canvas.width;
			petal.opacity = Math.random() * 0.4 + 0.6;
		}
	}

	function createPetal() {
		if (petals.length < 250) {
			petals.push(new Petal());
		}
	}

	function drawHearts(ctx) {
		for (let i = hearts.length - 1; i >= 0; i--) {
			const heart = hearts[i];
			heart.size += (heart.maxSize - heart.size) * 0.1;
			heart.opacity -= 0.02;
			heart.y -= 0.5;
			if (heart.opacity <= 0) { hearts.splice(i, 1); continue; }
			ctx.save();
			ctx.translate(heart.x, heart.y);
			ctx.globalAlpha = heart.opacity;
			ctx.fillStyle = 'rgba(255, 105, 180, 0.8)';
			ctx.beginPath();
			const size = heart.size;
			ctx.moveTo(0, size * 0.3);
			ctx.bezierCurveTo(size * 0.5, -size * 0.3, size, 0, 0, size);
			ctx.bezierCurveTo(-size, 0, -size * 0.5, -size * 0.3, 0, size * 0.3);
			ctx.fill();
			ctx.restore();
		}
	}

	// ===== Stars (Night) =====
	var stars = [];
	var meteors = [];

	function drawSky() {
		context.fillStyle = "#000";
		context.fillRect(0, 0, canvas.width, canvas.height);
	}

	function createStar() {
		var star = {
			x: Math.random() * canvas.width,
			y: Math.random() * canvas.height,
			size: Math.random() * 3 + 1,
			brightness: Math.random() * 0.5 + 0.5,
			blink: Math.random() * 10 + 5
		};
		stars.push(star);
		if (stars.length > 52) {
			stars.splice(0, 24);
		}
	}

	function createMeteor() {
		if (meteors.length < 3) {
			var meteor = {
				x: Math.random() * canvas.width,
				y: Math.random() * canvas.height,
				speed: Math.random() * 10 + 5,
				length: Math.random() * 80 + 20,
				angle: Math.random() * Math.PI / 2 + Math.PI / 4,
				trail: [],
				arcRadius: Math.random() * 100 + 50,
				arcAngle: 0
			};
			meteors.push(meteor);
		}
	}

	function drawStars() {
		for (var i = 0; i < stars.length; i++) {
			var star = stars[i];
			context.beginPath();
			context.arc(star.x, star.y, star.size, 0, Math.PI * 2);
			context.closePath();
			context.fillStyle = "rgba(255, 255, 255, " + star.brightness + ")";
			context.fill();
			star.blink--;
			if (star.blink <= 0) {
				star.brightness = Math.random() * 0.5 + 0.5;
				star.blink = Math.random() * 10 + 5;
			}
		}
	}

	function drawMeteors() {
		for (var i = 0; i < meteors.length; i++) {
			var meteor = meteors[i];
			meteor.arcAngle += meteor.speed / meteor.arcRadius;
			meteor.x += Math.cos(meteor.angle) * meteor.speed;
			meteor.y += Math.sin(meteor.angle) * meteor.speed;
			meteor.trail.push({ x: meteor.x, y: meteor.y });
			if (meteor.trail.length > meteor.length) {
				meteor.trail.shift();
			}
			if (meteor.arcAngle >= Math.PI) {
				meteors.splice(i, 1);
				i--;
				continue;
			}
			context.beginPath();
			context.moveTo(meteor.trail[0].x, meteor.trail[0].y);
			for (var j = 1; j < meteor.trail.length; j++) {
				context.lineTo(meteor.trail[j].x, meteor.trail[j].y);
			}
			var gradient = context.createLinearGradient(meteor.x, meteor.y, meteor.trail[0].x, meteor.trail[0].y);
			gradient.addColorStop(0, "rgba(255, 255, 255, 1)");
			gradient.addColorStop(1, "rgba(255, 255, 255, 0)");
			context.strokeStyle = gradient;
			context.lineWidth = 1;
			context.stroke();
		}
	}

	// ===== Milky Way (银河) - Diffuse glow, unique each time =====
	var milkyWayCanvas = null;
	var milkyWayBrightStars = [];
	var milkyWayRotation = 0;
	var milkyWayInitialized = false;

	function initMilkyWay() {
		milkyWayBrightStars = [];
		milkyWayRotation = Math.random() * Math.PI * 0.3 - Math.PI * 0.15;

		const W = canvas.width;
		const H = canvas.height;
		const diag = Math.sqrt(W * W + H * H);

		const bandAngle = -Math.PI / 5 + (Math.random() - 0.5) * 0.4;
		const bandWidth = H * (0.25 + Math.random() * 0.15);
		const cx = W / 2;
		const cy = H / 2;
		const perpAngle = bandAngle + Math.PI / 2;
		const bandLen = diag * 3;

		milkyWayCanvas = document.createElement('canvas');
		const mwScale = 3;
		milkyWayCanvas.width = W * mwScale;
		milkyWayCanvas.height = H * mwScale;
		const mwCtx = milkyWayCanvas.getContext('2d');
		const mwCx = (W * mwScale) / 2;
		const mwCy = (H * mwScale) / 2;
		mwCtx.clearRect(0, 0, W * mwScale, H * mwScale);
		mwCtx.globalCompositeOperation = 'lighter';

		// Layer 1: Broad diffuse base glow
		const baseCloudCount = 20 + Math.floor(Math.random() * 10);
		for (let i = 0; i < baseCloudCount; i++) {
			const t = (i + 0.5) / baseCloudCount;
			const along = (t - 0.5) * bandLen;
			const bx = mwCx + Math.cos(bandAngle) * along + (Math.random() - 0.5) * bandWidth * 0.3;
			const by = mwCy + Math.sin(bandAngle) * along + (Math.random() - 0.5) * bandWidth * 0.3;
			const sizeX = bandWidth * (0.5 + Math.random() * 0.6);
			const sizeY = bandWidth * (0.3 + Math.random() * 0.4);
			const baseAlpha = 0.04 + Math.random() * 0.03;

			const hueShift = Math.random();
			let cr, cg, cb;
			if (hueShift < 0.3) { cr = 140 + Math.random() * 30; cg = 150 + Math.random() * 30; cb = 200 + Math.random() * 40; }
			else if (hueShift < 0.6) { cr = 160 + Math.random() * 30; cg = 170 + Math.random() * 30; cb = 210 + Math.random() * 30; }
			else { cr = 180 + Math.random() * 20; cg = 175 + Math.random() * 25; cb = 195 + Math.random() * 30; }

			const gradient = mwCtx.createRadialGradient(bx, by, 0, bx, by, sizeX);
			gradient.addColorStop(0, 'rgba(' + Math.round(cr) + ',' + Math.round(cg) + ',' + Math.round(cb) + ',' + baseAlpha + ')');
			gradient.addColorStop(0.5, 'rgba(' + Math.round(cr) + ',' + Math.round(cg) + ',' + Math.round(cb) + ',' + (baseAlpha * 0.5) + ')');
			gradient.addColorStop(1, 'rgba(' + Math.round(cr) + ',' + Math.round(cg) + ',' + Math.round(cb) + ',0)');

			mwCtx.save();
			mwCtx.translate(bx, by);
			mwCtx.rotate(bandAngle);
			mwCtx.scale(1, sizeY / sizeX);
			mwCtx.translate(-bx, -by);
			mwCtx.fillStyle = gradient;
			mwCtx.fillRect(bx - sizeX * 1.5, by - sizeX * 1.5, sizeX * 3, sizeX * 3);
			mwCtx.restore();
		}

		// Layer 2: Brighter core clouds
		const coreCloudCount = 35 + Math.floor(Math.random() * 15);
		for (let i = 0; i < coreCloudCount; i++) {
			const t = 0.15 + Math.random() * 0.7;
			const along = (t - 0.5) * bandLen;
			const offset = (Math.random() - 0.5) * bandWidth * 0.5;
			const fx = mwCx + Math.cos(bandAngle) * along + Math.cos(perpAngle) * offset;
			const fy = mwCy + Math.sin(bandAngle) * along + Math.sin(perpAngle) * offset;
			const size = bandWidth * (0.1 + Math.random() * 0.25);
			const alpha = 0.03 + Math.random() * 0.04;

			const warmth = Math.random();
			let cr, cg, cb;
			if (warmth < 0.3) { cr = 200 + Math.random() * 40; cg = 190 + Math.random() * 30; cb = 160 + Math.random() * 40; }
			else if (warmth < 0.7) { cr = 180 + Math.random() * 30; cg = 185 + Math.random() * 30; cb = 210 + Math.random() * 30; }
			else { cr = 170 + Math.random() * 30; cg = 180 + Math.random() * 30; cb = 220 + Math.random() * 25; }

			const gradient = mwCtx.createRadialGradient(fx, fy, 0, fx, fy, size);
			gradient.addColorStop(0, 'rgba(' + Math.round(cr) + ',' + Math.round(cg) + ',' + Math.round(cb) + ',' + alpha + ')');
			gradient.addColorStop(0.3, 'rgba(' + Math.round(cr) + ',' + Math.round(cg) + ',' + Math.round(cb) + ',' + (alpha * 0.6) + ')');
			gradient.addColorStop(1, 'rgba(' + Math.round(cr) + ',' + Math.round(cg) + ',' + Math.round(cb) + ',0)');
			mwCtx.fillStyle = gradient;
			mwCtx.fillRect(fx - size, fy - size, size * 2, size * 2);
		}

		// Layer 3: Fine structure clumps
		const clumpCount = 60 + Math.floor(Math.random() * 20);
		for (let i = 0; i < clumpCount; i++) {
			const t = 0.1 + Math.random() * 0.8;
			const along = (t - 0.5) * bandLen;
			const offset = (Math.random() - 0.5) * bandWidth * 0.6;
			const fx = mwCx + Math.cos(bandAngle) * along + Math.cos(perpAngle) * offset;
			const fy = mwCy + Math.sin(bandAngle) * along + Math.sin(perpAngle) * offset;
			const size = bandWidth * (0.02 + Math.random() * 0.08);
			const alpha = 0.02 + Math.random() * 0.025;

			const gradient = mwCtx.createRadialGradient(fx, fy, 0, fx, fy, size);
			gradient.addColorStop(0, 'rgba(220,225,240,' + alpha + ')');
			gradient.addColorStop(1, 'rgba(200,210,230,0)');
			mwCtx.fillStyle = gradient;
			mwCtx.fillRect(fx - size, fy - size, size * 2, size * 2);
		}

		// Layer 4: Dark dust lanes
		mwCtx.globalCompositeOperation = 'destination-out';
		const dustCount = 5 + Math.floor(Math.random() * 4);
		for (let i = 0; i < dustCount; i++) {
			const t = 0.2 + Math.random() * 0.6;
			const along = (t - 0.5) * bandLen;
			const offset = (Math.random() - 0.5) * bandWidth * 0.3;
			const fx = mwCx + Math.cos(bandAngle) * along + Math.cos(perpAngle) * offset;
			const fy = mwCy + Math.sin(bandAngle) * along + Math.sin(perpAngle) * offset;
			const sizeX = bandWidth * (0.08 + Math.random() * 0.15);
			const sizeY = bandWidth * (0.03 + Math.random() * 0.06);
			const dustAlpha = 0.3 + Math.random() * 0.4;

			const gradient = mwCtx.createRadialGradient(fx, fy, 0, fx, fy, sizeX);
			gradient.addColorStop(0, 'rgba(0,0,0,' + dustAlpha + ')');
			gradient.addColorStop(0.5, 'rgba(0,0,0,' + (dustAlpha * 0.3) + ')');
			gradient.addColorStop(1, 'rgba(0,0,0,0)');

			mwCtx.save();
			mwCtx.translate(fx, fy);
			mwCtx.rotate(bandAngle + (Math.random() - 0.5) * 0.5);
			mwCtx.scale(1, sizeY / sizeX);
			mwCtx.translate(-fx, -fy);
			mwCtx.fillStyle = gradient;
			mwCtx.fillRect(fx - sizeX * 1.5, fy - sizeX * 1.5, sizeX * 3, sizeX * 3);
			mwCtx.restore();
		}

		mwCtx.globalCompositeOperation = 'source-over';

		// Layer 5: Dense field of small stars in the band
		const smallStarCount = 300 + Math.floor(Math.random() * 100);
		for (let i = 0; i < smallStarCount; i++) {
			const t = 0.05 + Math.random() * 0.9;
			const along = (t - 0.5) * bandLen;
			const offset = (Math.random() - 0.5) * bandWidth * 0.9;
			const sx = mwCx + Math.cos(bandAngle) * along + Math.cos(perpAngle) * offset;
			const sy = mwCy + Math.sin(bandAngle) * along + Math.sin(perpAngle) * offset;

			// Gaussian-like distribution - more stars near center
			const distFactor = Math.abs(offset) / (bandWidth * 0.9);
			if (Math.random() < distFactor * 0.7) continue; // Skip stars far from center

			const size = Math.random() * 1.2 + 0.3;
			const alpha = 0.3 + Math.random() * 0.5;

			mwCtx.fillStyle = 'rgba(230,235,245,' + alpha + ')';
			mwCtx.beginPath();
			mwCtx.arc(sx, sy, size, 0, Math.PI * 2);
			mwCtx.fill();
		}

		// Layer 6: Sparse bright stars you can pick out
		const brightStarCount = 30 + Math.floor(Math.random() * 20);
		for (let i = 0; i < brightStarCount; i++) {
			const t = 0.05 + Math.random() * 0.9;
			const along = (t - 0.5) * bandLen;
			const offset = (Math.random() - 0.5) * bandWidth * 0.8;
			const x = cx + Math.cos(bandAngle) * along + Math.cos(perpAngle) * offset;
			const y = cy + Math.sin(bandAngle) * along + Math.sin(perpAngle) * offset;

			if (x > -50 && x < W + 50 && y > -50 && y < H + 50) {
				milkyWayBrightStars.push({
					x: x, y: y,
					size: Math.random() * 1.5 + 0.5,
					brightness: Math.random() * 0.5 + 0.5,
					twinkleSpeed: Math.random() * 0.03 + 0.01,
					twinkleOffset: Math.random() * Math.PI * 2,
					r: 220 + Math.random() * 35,
					g: 225 + Math.random() * 30,
					b: 235 + Math.random() * 20
				});
			}
		}

		milkyWayInitialized = true;
	}

	function drawMilkyWay() {
		if (!milkyWayInitialized) {
			initMilkyWay();
		}

		context.save();
		const centerX = canvas.width / 2;
		const centerY = canvas.height / 2;
		context.translate(centerX, centerY);
		context.rotate(milkyWayRotation);
		context.translate(-centerX, -centerY);

		// Draw the larger offscreen canvas offset so center aligns
		const mwW = milkyWayCanvas.width;
		const mwH = milkyWayCanvas.height;
		context.drawImage(milkyWayCanvas, centerX - mwW / 2, centerY - mwH / 2);

		const time = Date.now() * 0.001;
		for (let i = 0; i < milkyWayBrightStars.length; i++) {
			const star = milkyWayBrightStars[i];
			const twinkle = Math.sin(time * star.twinkleSpeed * 10 + star.twinkleOffset) * 0.3 + 0.7;
			const alpha = star.brightness * twinkle;
			context.fillStyle = 'rgba(' + Math.round(star.r) + ',' + Math.round(star.g) + ',' + Math.round(star.b) + ',' + alpha + ')';
			context.beginPath();
			context.arc(star.x, star.y, star.size, 0, Math.PI * 2);
			context.fill();
		}

		context.restore();

		milkyWayRotation += 0.00008;
		if (milkyWayRotation > Math.PI * 2) {
			milkyWayRotation -= Math.PI * 2;
		}
	}

	// ===== Fireflies (Summer Night) =====
	var fireflies = [];

	function Firefly() {
		this.x = Math.random() * canvas.width;
		this.y = Math.random() * canvas.height;
		this.size = Math.random() * 3 + 2;
		this.speedX = (Math.random() - 0.5) * 0.5;
		this.speedY = (Math.random() - 0.5) * 0.5;
		this.brightness = Math.random();
		this.blinkSpeed = Math.random() * 0.02 + 0.01;
		this.blinkDirection = 1;
		this.wobble = Math.random() * Math.PI * 2;
		this.wobbleSpeed = Math.random() * 0.02 + 0.01;

		const colorTypes = [
			{ inner: 'rgba(255, 255, 100, 0.9)', mid: 'rgba(200, 255, 100, 0.6)', outer: 'rgba(100, 255, 50, 0)', core: 'rgba(255, 255, 200, 1)' },
			{ inner: 'rgba(255, 100, 150, 0.9)', mid: 'rgba(255, 150, 180, 0.6)', outer: 'rgba(255, 50, 100, 0)', core: 'rgba(255, 200, 220, 1)' },
			{ inner: 'rgba(255, 150, 100, 0.9)', mid: 'rgba(255, 180, 120, 0.6)', outer: 'rgba(255, 100, 50, 0)', core: 'rgba(255, 220, 180, 1)' }
		];
		this.colors = colorTypes[Math.floor(Math.random() * colorTypes.length)];
	}

	function updateFirefly(firefly) {
		firefly.x += firefly.speedX + Math.sin(firefly.wobble) * 0.3;
		firefly.y += firefly.speedY + Math.cos(firefly.wobble) * 0.3;
		firefly.wobble += firefly.wobbleSpeed;

		firefly.brightness += firefly.blinkSpeed * firefly.blinkDirection;
		if (firefly.brightness >= 1) {
			firefly.brightness = 1;
			firefly.blinkDirection = -1;
		} else if (firefly.brightness <= 0.1) {
			firefly.brightness = 0.1;
			firefly.blinkDirection = 1;
		}

		if (firefly.x < -20) firefly.x = canvas.width + 20;
		if (firefly.x > canvas.width + 20) firefly.x = -20;
		if (firefly.y < -20) firefly.y = canvas.height + 20;
		if (firefly.y > canvas.height + 20) firefly.y = -20;
	}

	function drawFireflies() {
		for (var i = 0; i < fireflies.length; i++) {
			var firefly = fireflies[i];
			updateFirefly(firefly);

			context.save();
			context.globalAlpha = firefly.brightness;

			var gradient = context.createRadialGradient(
				firefly.x, firefly.y, 0,
				firefly.x, firefly.y, firefly.size * 3
			);
			gradient.addColorStop(0, firefly.colors.inner);
			gradient.addColorStop(0.3, firefly.colors.mid);
			gradient.addColorStop(1, firefly.colors.outer);

			context.fillStyle = gradient;
			context.beginPath();
			context.arc(firefly.x, firefly.y, firefly.size * 3, 0, Math.PI * 2);
			context.fill();

			context.fillStyle = firefly.colors.core;
			context.beginPath();
			context.arc(firefly.x, firefly.y, firefly.size, 0, Math.PI * 2);
			context.fill();

			context.restore();
		}
	}

	function createFirefly() {
		if (fireflies.length < 50) {
			fireflies.push(new Firefly());
		}
	}

	// ===== Snowflakes (Winter Night) =====
	var snowflakes = [];

	function Snowflake() {
		this.x = Math.random() * canvas.width;
		this.y = Math.random() * -canvas.height;
		this.size = Math.random() * 4 + 2;
		this.speedY = Math.random() * 1 + 0.5;
		this.speedX = (Math.random() - 0.5) * 0.5;
		this.rotation = Math.random() * 360;
		this.rotationSpeed = (Math.random() - 0.5) * 2;
		this.opacity = Math.random() * 0.5 + 0.5;
		this.wobble = Math.random() * Math.PI * 2;
		this.wobbleSpeed = Math.random() * 0.02 + 0.01;

		// Randomly assign snowflake shape type based on scientific distribution
		// Dendritic: 35%, Plate: 28%, Fern: 15%, Columnar: 12%, Needle: 7%, Irregular: 3%
		const rand = Math.random() * 100;
		if (rand < 35) {
			this.shape = 'dendritic';
		} else if (rand < 63) { // 35 + 28 = 63
			this.shape = 'plate';
		} else if (rand < 78) { // 63 + 15 = 78
			this.shape = 'fern';
		} else if (rand < 90) { // 78 + 12 = 90
			this.shape = 'columnar';
		} else if (rand < 97) { // 90 + 7 = 97
			this.shape = 'needle';
		} else {
			this.shape = 'irregular';
		}
	}

	function updateSnowflake(snowflake) {
		snowflake.y += snowflake.speedY;
		snowflake.x += snowflake.speedX + Math.sin(snowflake.wobble) * 0.3;
		snowflake.wobble += snowflake.wobbleSpeed;
		snowflake.rotation += snowflake.rotationSpeed;

		if (snowflake.y > canvas.height + 20) {
			snowflake.y = Math.random() * -100;
			snowflake.x = Math.random() * canvas.width;
		}
	}

	// Draw dendritic snowflake (classic branching star)
	function drawDendritic(snowflake) {
		context.strokeStyle = 'rgba(255, 255, 255, 1)';
		context.lineWidth = 1;

		for (let i = 0; i < 6; i++) {
			context.beginPath();
			context.moveTo(0, 0);
			context.lineTo(0, -snowflake.size * 2);
			context.stroke();

			// Branches
			context.beginPath();
			context.moveTo(0, -snowflake.size);
			context.lineTo(snowflake.size * 0.5, -snowflake.size * 1.5);
			context.stroke();

			context.beginPath();
			context.moveTo(0, -snowflake.size);
			context.lineTo(-snowflake.size * 0.5, -snowflake.size * 1.5);
			context.stroke();

			context.rotate(60 * Math.PI / 180);
		}
	}

	// Draw plate-like snowflake (hexagonal plate)
	function drawPlate(snowflake) {
		context.strokeStyle = 'rgba(255, 255, 255, 1)';
		context.fillStyle = 'rgba(255, 255, 255, 0.3)';
		context.lineWidth = 1;

		context.beginPath();
		for (let i = 0; i < 6; i++) {
			const angle = (i * 60) * Math.PI / 180;
			const x = Math.cos(angle) * snowflake.size * 1.5;
			const y = Math.sin(angle) * snowflake.size * 1.5;
			if (i === 0) context.moveTo(x, y);
			else context.lineTo(x, y);
		}
		context.closePath();
		context.fill();
		context.stroke();
	}

	// Draw columnar snowflake (tube/column shape)
	function drawColumnar(snowflake) {
		context.strokeStyle = 'rgba(255, 255, 255, 1)';
		context.fillStyle = 'rgba(255, 255, 255, 0.2)';
		context.lineWidth = 1;

		const width = snowflake.size * 0.8;
		const height = snowflake.size * 2.5;

		context.beginPath();
		context.rect(-width, -height, width * 2, height * 2);
		context.fill();
		context.stroke();

		// Top and bottom caps
		context.beginPath();
		context.ellipse(0, -height, width, width * 0.3, 0, 0, Math.PI * 2);
		context.stroke();

		context.beginPath();
		context.ellipse(0, height, width, width * 0.3, 0, 0, Math.PI * 2);
		context.stroke();
	}

	// Draw needle-like snowflake (elongated needle)
	function drawNeedle(snowflake) {
		context.strokeStyle = 'rgba(255, 255, 255, 1)';
		context.lineWidth = 1.5;

		context.beginPath();
		context.moveTo(0, -snowflake.size * 3);
		context.lineTo(0, snowflake.size * 3);
		context.stroke();

		// Small branches at ends
		context.beginPath();
		context.moveTo(0, -snowflake.size * 2.5);
		context.lineTo(snowflake.size * 0.3, -snowflake.size * 2);
		context.stroke();

		context.beginPath();
		context.moveTo(0, -snowflake.size * 2.5);
		context.lineTo(-snowflake.size * 0.3, -snowflake.size * 2);
		context.stroke();

		context.beginPath();
		context.moveTo(0, snowflake.size * 2.5);
		context.lineTo(snowflake.size * 0.3, snowflake.size * 2);
		context.stroke();

		context.beginPath();
		context.moveTo(0, snowflake.size * 2.5);
		context.lineTo(-snowflake.size * 0.3, snowflake.size * 2);
		context.stroke();
	}

	// Draw fern-like dendritic snowflake (complex branching)
	function drawFern(snowflake) {
		context.strokeStyle = 'rgba(255, 255, 255, 1)';
		context.lineWidth = 1;

		for (let i = 0; i < 6; i++) {
			// Main branch
			context.beginPath();
			context.moveTo(0, 0);
			context.lineTo(0, -snowflake.size * 2.5);
			context.stroke();

			// Multiple sub-branches
			for (let j = 1; j <= 3; j++) {
				const branchY = -snowflake.size * j * 0.6;
				const branchLen = snowflake.size * (0.8 - j * 0.15);

				context.beginPath();
				context.moveTo(0, branchY);
				context.lineTo(branchLen, branchY - snowflake.size * 0.4);
				context.stroke();

				context.beginPath();
				context.moveTo(0, branchY);
				context.lineTo(-branchLen, branchY - snowflake.size * 0.4);
				context.stroke();
			}

			context.rotate(60 * Math.PI / 180);
		}
	}

	// Draw irregular snowflake (random shape)
	function drawIrregular(snowflake) {
		context.strokeStyle = 'rgba(255, 255, 255, 1)';
		context.fillStyle = 'rgba(255, 255, 255, 0.2)';
		context.lineWidth = 1;

		context.beginPath();
		const points = 5 + Math.floor(Math.random() * 4);
		for (let i = 0; i < points; i++) {
			const angle = (i * 360 / points) * Math.PI / 180;
			const radius = snowflake.size * (1 + Math.random() * 0.8);
			const x = Math.cos(angle) * radius;
			const y = Math.sin(angle) * radius;
			if (i === 0) context.moveTo(x, y);
			else context.lineTo(x, y);
		}
		context.closePath();
		context.fill();
		context.stroke();
	}

	function drawSnowflake(snowflake) {
		context.save();
		context.translate(snowflake.x, snowflake.y);
		context.rotate(snowflake.rotation * Math.PI / 180);
		context.globalAlpha = snowflake.opacity;

		switch(snowflake.shape) {
			case 'dendritic':
				drawDendritic(snowflake);
				break;
			case 'plate':
				drawPlate(snowflake);
				break;
			case 'columnar':
				drawColumnar(snowflake);
				break;
			case 'needle':
				drawNeedle(snowflake);
				break;
			case 'fern':
				drawFern(snowflake);
				break;
			case 'irregular':
				drawIrregular(snowflake);
				break;
		}

		context.restore();
	}

	function drawSnowflakes() {
		for (var i = 0; i < snowflakes.length; i++) {
			var snowflake = snowflakes[i];
			updateSnowflake(snowflake);
			drawSnowflake(snowflake);
		}
	}

	function createSnowflake() {
		if (snowflakes.length < 150) {
			snowflakes.push(new Snowflake());
		}
	}

	// ===== Timer =====
	function updateTimer() {
		var currentTime = new Date().getTime();
		var timeDiff = currentTime - startTime;
		var seconds = Math.floor(timeDiff / 1000);
		var minutes = Math.floor(seconds / 60);
		var hours = Math.floor(minutes / 60);
		var days = Math.floor(hours / 24);
		hours %= 24;
		minutes %= 60;
		seconds %= 60;
		var timer = document.getElementById("timer");
		timer.innerHTML = "<day>" + days + "</day> <times>" + hours + ":" + minutes + ":" + seconds + "</times>";
	}

	// ===== Main Loop =====
	function loop() {
		context.clearRect(0, 0, canvas.width, canvas.height);

		if (isNight()) {
			drawSky();
			const season = getSeason();

			if (season === 'winter') {
				// Winter: only snowflakes, no stars
				if (Math.random() < 0.3) createSnowflake();
				drawSnowflakes();
			} else {
				// Spring, Summer, Autumn: stars + meteors
				if (Math.random() < 0.05) createStar();
				if (Math.random() < 0.05) createMeteor();
				drawStars();
				drawMeteors();

				// Summer: add fireflies and milky way
				if (season === 'summer') {
					if (Math.random() < 0.05) createFirefly();
					drawFireflies();
					drawMilkyWay();
				}
			}
		} else {
			const season = getSeason();

			if (season !== 'spring') {
				if (Math.random() < 0.25) createPetal();
				petals.forEach(function(petal) {
					updatePetal(petal);
					drawFallingPetal(context, petal.x, petal.y, petal.size,
						petal.rotation, petal.baseColor + petal.opacity + ')', petal.opacity, petal.wobble);
				});
			}
			drawHearts(context);
		}

		updateTimer();
		requestAnimationFrame(loop);
	}

	window.addEventListener('resize', function() {
		canvas.width = window.innerWidth;
		canvas.height = window.innerHeight;
		petals = [];
		stars = [];
		meteors = [];
		fireflies = [];
		snowflakes = [];
		milkyWayInitialized = false;
	});

	// ===== Test Panel =====
	let testMode = false;
	let testHour = null;
	let testMinute = null;
	let testSeasonOverride = null;

	// Override isNight to use test time if set
	const originalIsNight = isNight;
	isNight = function() {
		if (testMode && testHour !== null && testMinute !== null) {
			// Simple rule: 6:00-20:00 is day, otherwise night
			return testHour < 6 || testHour >= 20;
		}
		return originalIsNight();
	};

	// Override getSeason to use test season if set
	const originalGetSeason = getSeason;
	getSeason = function() {
		if (testMode && testSeasonOverride) {
			return testSeasonOverride;
		}
		return originalGetSeason();
	};

	function toggleTestPanel() {
		const panel = document.getElementById('test-panel');
		panel.classList.toggle('active');
	}

	function applyTestSettings() {
		const hourInput = document.getElementById('test-hour').value;
		const minuteInput = document.getElementById('test-minute').value;
		const seasonSelect = document.getElementById('test-season').value;

		testMode = true;
		testHour = hourInput !== '' ? parseInt(hourInput) : null;
		testMinute = minuteInput !== '' ? parseInt(minuteInput) : null;
		testSeasonOverride = seasonSelect !== 'auto' ? seasonSelect : null;

		applyTheme();
		console.log('Test mode applied:', { hour: testHour, minute: testMinute, season: testSeasonOverride });
	}

	function resetTestSettings() {
		testMode = false;
		testHour = null;
		testMinute = null;
		testSeasonOverride = null;
		document.getElementById('test-hour').value = '';
		document.getElementById('test-minute').value = '';
		document.getElementById('test-season').value = 'auto';
		applyTheme();
		console.log('Test mode reset');
	}

	// Toggle panel with T key
	document.addEventListener('keydown', function(event) {
		if (event.key === 't' || event.key === 'T') {
			if (event.target.tagName !== 'INPUT' && event.target.tagName !== 'SELECT') {
				toggleTestPanel();
			}
		}
	});

	loop();
</script>
