		<!-- Watercolor gradient for grass -->
		<linearGradient id="grassGradient" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" style="stop-color:#d4e8d0;stop-opacity:0" />
			<stop offset="40%" style="stop-color:#b8d4b0;stop-opacity:0.3" />
			<stop offset="100%" style="stop-color:#8fbc8f;stop-opacity:0.6" />
		</linearGradient>

		<!-- Leaf gradient - yellow-green -->
		<linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" style="stop-color:#d4e09b;stop-opacity:0.85" />
			<stop offset="50%" style="stop-color:#c5d98e;stop-opacity:0.7" />
			<stop offset="100%" style="stop-color:#a8c97a;stop-opacity:0.55" />
		</linearGradient>

		<!-- Willow branch filter for watercolor effect -->
		<filter id="watercolor">
			<feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
			<feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
		</filter>
		<!-- Depth-of-field blur filters -->
		<filter id="depth-blur-far">
			<feGaussianBlur stdDeviation="2.5" />
		</filter>
		<filter id="depth-blur-mid">
			<feGaussianBlur stdDeviation="1.2" />
		</filter>
		<filter id="depth-blur-near">
			<feGaussianBlur stdDeviation="0.4" />
		</filter>

		<!-- Atmospheric haze gradient -->
		<linearGradient id="hazeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" style="stop-color:#e8f0e0;stop-opacity:0.15" />
			<stop offset="50%" style="stop-color:#dce8d4;stop-opacity:0.08" />
			<stop offset="100%" style="stop-color:#c8dcc0;stop-opacity:0.18" />
		</linearGradient>

		<!-- Morning glow radial gradient -->
		<radialGradient id="morningGlow" cx="25%" cy="20%" r="60%">
			<stop offset="0%" style="stop-color:#fff8e7;stop-opacity:0.25" />
			<stop offset="30%" style="stop-color:#fef0d0;stop-opacity:0.12" />
			<stop offset="70%" style="stop-color:#fde8c8;stop-opacity:0.04" />
			<stop offset="100%" style="stop-color:#fde8c8;stop-opacity:0" />
		</radialGradient>

		<!-- Soft edge feathering for overlays -->
		<filter id="soft-edge">
			<feGaussianBlur stdDeviation="8" />
		</filter>

			<stop offset="60%" style="stop-color:#dfeee8;stop-opacity:1" />
			<stop offset="100%" style="stop-color:#f5ecd7;stop-opacity:1" />
		</linearGradient>
